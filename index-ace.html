<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>go-xml XML workbench: XSLT 3.0, XQuery 3.1, XPath 3.1</title>

  <link rel="stylesheet" href="css/ace-fiddle.css">

	<script>
    var gistId = null;
    var gistBaseURI = null;

    var inputBaseURI = 'urn:from-string';
    var codeBaseURI = 'urn:from-string';

    var doneTypingInterval = 1000;
    var typingTimeout;

    var autoEvaluation = false;

    function evaluate() {
      var inputType = document.getElementById('input-types').form['input-type'].value;
      var codeType = document.getElementById('input-types').form['code-type'].value;
      var codeFileInput = document.getElementById('codeFile');
      var codeFileName = codeFileInput != null ? codeFileInput.value : '';
      var inputFileInput = document.getElementById('inputFile');
      var inputFileName = inputFileInput != null ? inputFileInput.value : '';
      //var inputBaseURI = inputFileName != '' && gistId != null ? new URL(inputFileName, gistBaseURI).href : 'urn:from-string';
      //var codeBaseURI = codeFileName != '' && gistId != null ? new URL(codeFileName, gistBaseURI).href : 'urn:from-string';
      if (codeType === 'XSLT')
        transform(inputType !== 'None' ? inputEditor.session.getValue() : null, codeEditor.session.getValue(), inputType, codeBaseURI, inputBaseURI, document.getElementById('results'));
      else if (codeType === 'XQuery')
        xquery(inputType !== 'None' ? inputEditor.session.getValue() : null, codeEditor.session.getValue(), inputType,  codeBaseURI, inputBaseURI, document.getElementById('results'));
      else if (codeType === 'XPath')
        xpath(inputType !== 'None' ? inputEditor.session.getValue() : null, codeEditor.session.getValue(), inputType,  codeBaseURI, inputBaseURI, document.getElementById('results'));
    }

    function wait(time) {
      return new Promise(res => setTimeout(res, time));
    }

    function autoEvaluate() {
      typingTimeout = autoEvaluation ? setTimeout(evaluate, doneTypingInterval) : 0;//new Promise(res => setTimeout(evaluate, doneTypingInterval)) : 0;
    }

    // The result documents currently listed, kept so that the save link can
    // find the output method and the label of whichever one is selected.
    var currentResults = [];

    function renderXsltResults(results, resultsSelect) {

      currentResults = results;

      resultsSelect.length = 0;

      results.forEach((result, index) => {
        resultsSelect.appendChild(new Option(result.uri, result.uri));
        if (index === 0) {
          writeResult(window.frames['current-result-frame'], result.content);
        }
      });

      resultsSelect.onchange = function (evt) {
        var selectedResult = results[this.selectedIndex];
        setDocument(resultEditor, selectedResult.content, selectedResult.method);

        if (document.getElementById('render-box').checked) {
          writeResult(window.frames['current-result-frame'], results[this.selectedIndex].content);
        }
      };

      setDocument(resultEditor, results[0].content, results[0].method);

    }

    function renderResults(results, resultsSelect) {
      resultsSelect.length = 0;
      var principalResult = results[0];
      // XPath and XQuery are serialized with the adaptive method, which is a
      // sequence rather than a document, so there is nothing to list and no
      // markup mode to put the editor in.
      currentResults = [{ uri: 'result', content: principalResult, method: 'adaptive' }];
      setDocument(resultEditor, principalResult, 'xml');
      writeResult(window.frames['current-result-frame'], principalResult);
    }

    // saveResult arms the download link for the result the dropdown shows.
    //
    // The label of a result is not usable as a file name as it stands: the
    // primary result, the messages and the warnings are listed under
    // asterisked titles, and an xsl:result-document href is a URI reference
    // that may carry directories and a query. Both are reduced to a plain
    // name here, and the output method supplies the extension and the media
    // type when the label has no extension of its own.
    function saveResult(anchor) {
      var selected = document.getElementById('results').selectedIndex;
      var result = currentResults[selected] || currentResults[0] ||
          { uri: 'result', method: 'text' };
      anchor.download = resultFileName(result.uri, result.method);
      var blob = new Blob([resultEditor.session.getValue()],
          { type: methodMediaTypes[result.method] || 'text/plain' });
      anchor.href = window.URL.createObjectURL(blob);
    }

    function resultFileName(label, method) {
      var name = String(label == null ? '' : label).replace(/\*/g, '').trim();
      // An href names a path; only its last segment is the file, and a query
      // or fragment is not part of the name at all.
      name = name.split(/[?#]/)[0];
      name = name.slice(Math.max(name.lastIndexOf('/'), name.lastIndexOf('\\')) + 1);
      // Everything Windows forbids in a name, plus whitespace, which survives
      // a download but makes a poor file name.
      name = name.replace(/[<>:"/\\|?*\x00-\x1f]/g, '-').replace(/\s+/g, '-');
      if (name === '' || name === '.' || name === '..') {
        name = 'result';
      }
      if (!/\.[A-Za-z0-9]+$/.test(name)) {
        name += '.' + (methodExtensions[method] || 'txt');
      }
      return name;
    }

    const goXmlWorker = new Worker("worker.js");

    let workerReady = false;

    goXmlWorker.onmessage = ({ data }) => {
        let { action, payload } = data;
      if (action === 'XSLT-Results') {
        renderXsltResults(payload, document.querySelector('#results'));
      }
      else if (action === 'result') {
        renderResults([payload], document.querySelector('#results'));
      }
      else if (action === 'hide') {
        document.getElementById(payload.id).style.display = 'none';
        if (payload.id === 'go-xml-load-indicator' && autoEvaluation) {
          evaluate();
        }
      }
      else if (action === 'ready') {
          workerReady = true;
      }
      else {
        setDocument(resultEditor, payload, 'text');
      }
    }

    document.addEventListener('DOMContentLoaded', autoEvaluate, false);

    // The base URIs are passed through as they are, including the
    // 'urn:from-string' marker the editors carry until an example is loaded.
    // Nothing relative can resolve against a urn: -- it is not hierarchical
    // -- so an xsl:include in hand-typed text is reported as unresolvable
    // rather than silently ignored, which is the right answer for it.
    function xpath(input, xpathCode, inputType, codeBaseURI, inputBaseURI, resultsSelect) {
        if (workerReady) {
            if (!autoEvaluation)
                setDocument(resultEditor, "Evaluating your XPath...", "text");

            goXmlWorker.postMessage({action: "xpath",
                payload: {
                    xml: input,
                    inputType: inputType,
                    expression: xpathCode,
                    codeBaseURI: codeBaseURI,
                    inputBaseURI: inputBaseURI
                }
            });
        }
    }

    function xquery(input, xquery, inputType, codeBaseURI, inputBaseURI, resultsSelect) {
        if (workerReady) {
            if (!autoEvaluation)
                setDocument(resultEditor, "Processing your XQuery...", "text");

            goXmlWorker.postMessage({action: "xquery",
                payload: {
                    xml: input,
                    inputType: inputType,
                    query: xquery,
                    codeBaseURI: codeBaseURI,
                    inputBaseURI: inputBaseURI
                }
            });
        }
    }

    function transform(input, xslt, inputType, xsltBaseURI, inputBaseURI, resultsSelect) {
        if (workerReady) {
            if (!autoEvaluation)
                setDocument(resultEditor, "Processing your XSLT...", "text");

            goXmlWorker.postMessage({action: "xslt",
                payload: {
                    xml: input,
                    inputType: inputType,
                    xslt: xslt,
                    codeBaseURI: xsltBaseURI,
                    inputBaseURI: inputBaseURI
                }
            });
        }
    }

    </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.44.0/ace.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.44.0/mode-xml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.44.0/mode-html.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.44.0/mode-json.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.44.0/mode-xquery.js"></script>
</head>
<body class="container">
<header>
    <nav class="grid-row button-bar">
        <h2>XML Workbench</h2>
        <form id="input-type-form" onsubmit="return false;">
            <fieldset id="input-types">
                <legend>input type</legend>
                <label><input type="radio" name="input-type" value="XML" checked>XML</label>
                <label><input type="radio" name="input-type" value="JSON">JSON</label>
                <label><input type="radio" name="input-type" value="None">No input</label>
            </fieldset>
            <fieldset id="code-types">
                <legend>code type</legend>
                <label><input type="radio" name="code-type" value="XSLT" checked>XSLT</label>
                <label><input type="radio" name="code-type" value="XQuery">XQuery</label>
                <label><input type="radio" name="code-type" value="XPath">XPath</label>
                <!--<label><input type="radio" name="code-type" value="XSD">XSD</label>-->
            </fieldset>
        </form>
      <label>Examples: <select id="examples" onchange="loadExample(this.options[this.selectedIndex].dataset.codeUrl, this.options[this.selectedIndex].dataset.codeType, this.options[this.selectedIndex].dataset.inputUrl, this.options[this.selectedIndex].dataset.inputType);">
        <option data-code-url="" data-input-url="" data-code-type="XSLT" selected>-- choose an example --</option>
        <optgroup label="XSLT for-each-group group-by">
          <option data-code-url="examples/xslt/for-each-group/group-by/group-xml-cities-by-country.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-by/cities.xml" data-input-type="XML">group-by simple example 1</option>
          <option data-code-url="examples/xslt/for-each-group/group-by/group-xml-cities-by-name-and-country.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-by/cities-pop-year.xml" data-input-type="XML">group-by composite grouping key example 1</option>
          <option data-code-url="examples/xslt/for-each-group/group-by/group-by-item-belongs-to-several-groups.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-by/titles.xml" data-input-type="XML">group-by item can belong to multiple groups</option>
          <option data-code-url="examples/xslt/for-each-group/group-by/group-by-json-to-json.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-by/items-sample1.json" data-input-type="JSON">group-by JSON to JSON</option>
        </optgroup>
        <optgroup label="XSLT for-each-group group-adjacent">
          <option data-code-url="examples/xslt/for-each-group/group-adjacent/sheet1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-adjacent/sample1.xml" data-input-type="XML">group-adjacent example 1</option>
          <option data-code-url="examples/xslt/for-each-group/group-adjacent/positional-grouping-example1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-adjacent/items-sample-25.xml" data-input-type="XML">positional grouping example 1</option>
          <option data-code-url="examples/xslt/for-each-group/group-adjacent/positional-grouping-example2.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-adjacent/items-sample-25.xml" data-input-type="XML">positional grouping example 2</option>
        </optgroup>
        <optgroup label="XSLT for-each-group group-starting-with">
             <option data-code-url="examples/xslt/for-each-group/group-starting-with/sheet1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-starting-with/sample1.xml" data-input-type="XML">group-starting-with example 1</option>
        </optgroup>
        <optgroup label="XSLT for-each-group group-ending-with">
          <option data-code-url="examples/xslt/for-each-group/group-ending-with/sheet1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/for-each-group/group-ending-with/sample1.xml" data-input-type="XML">group-ending-with example 1</option>
        </optgroup>
        <optgroup label="XSLT iterate">
          <option data-code-url="examples/xslt/iterate/fibonacci-iterate1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/iterate/fibonacci-iterate-input.xml" data-input-type="XML">fibonacci number</option>
        </optgroup>
        <optgroup label="XSLT function">
          <option data-code-url="examples/xslt/function/memo-function-fibonacci1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/function/fibonacci-memo-function-input.xml" data-input-type="XML">fibonacci number</option>
        </optgroup>
        <optgroup label="fn:transform">
            <option data-code-url="examples/xslt/fn-transform/post-process-test1.xsl" data-code-type="XSLT" data-input-url="examples/xslt/fn-transform/sample1.xml" data-input-type="XML">fn:transform and post-process example</option>
        </optgroup>
        <optgroup label="Schematron">
          <option data-code-url="examples/xslt/schematron/schxslt2/transpile.xsl" data-code-type="XSLT" data-input-url="examples/xslt/schematron/price.sch" data-input-type="XML">Schematron transpilation sample 1</option>
          <option data-code-url="examples/xslt/schematron/schxslt2/transpile.xsl" data-code-type="XSLT" data-input-url="examples/xslt/schematron/flowers.sch" data-input-type="XML">Schematron transpilation sample 2</option>
          <option data-code-url="examples/xslt/schematron/schxslt2/transpile-schematron-and-validate-instance.xsl" data-code-type="XSLT" data-input-url="examples/xslt/schematron/books.xml" data-input-type="XML">Schematron transpilation/validation sample1</option>
        </optgroup>
          <optgroup label="Docbook">
              <option data-code-url="examples/xslt/docbook/xslt/docbook.xsl" data-code-type="XSLT" data-input-url="examples/xslt/docbook/samples/article.xml" data-input-type="XML" >Docbook article transform with Docbook TNG</option>
          </optgroup>
      </select></label>
      <label>auto-evaluation <input type="checkbox" id="auto-evaluate" checked></label>
      <!-- The base URIs come from the globals loadExample sets. They used to
           be recomputed here from a gist id that is never assigned, so every
           click passed 'urn:from-string' and shadowed the real ones -- which
           went unnoticed while nothing resolved relative URIs, and stops a
           module-based stylesheet compiling now that something does. -->
      <input type="button" id="transform" value="XSLT transformation" accesskey="t"
             onclick="var inputType = document.getElementById('input-types').form['input-type'].value;
                        transform(inputType !== 'None' ? inputEditor.session.getValue() : null, codeEditor.session.getValue(), inputType, codeBaseURI, inputBaseURI, document.getElementById('results'));">
      <input type="button" id="xquery" value="XQuery" accesskey="q"
             onclick="var inputType = document.getElementById('input-types').form['input-type'].value;
                        xquery(inputType !== 'None' ? inputEditor.session.getValue() : null, codeEditor.session.getValue(), inputType, codeBaseURI, inputBaseURI, document.getElementById('results'));">
      <input type="button" id="xpath" value="XPath" accesskey="a"
             onclick="var inputType = document.getElementById('input-types').form['input-type'].value;
                        xpath(inputType !== 'None' ? inputEditor.session.getValue() : null, codeEditor.session.getValue(), inputType, codeBaseURI, inputBaseURI, document.getElementById('results'));">
      <!--<input type="button" id="xsd" value="XSD" accesskey="V" title="validate XML against XSD schema"
            onclick="validate(inputEditor.session.getValue(), codeEditor.session.getValue(), document.getElementById('results'));">-->
      <input type="button" id="save" value="save as URL" accesskey="s"
             onclick="save(document.getElementById('input-type-form'));">
    </nav>
</header>
<div id="go-load-indicator" style="color: red; font-weight: bolder; text-align: center;">go worker is not (yet) initialized.</div>
<div id="go-xml-load-indicator" style="color: red; font-weight: bolder; text-align: center;">go-xml is not (yet) initialized.</div>
<div class="view-container">

    <main role="main" class="pb-3 view-container">

        <section class="grid-row" id="input-code-row">
            <div id="input-col" class="grid-item">
                <div id="input-editor" class="editor"></div>
                <input type="button" id="load-input" value="load" onclick="document.getElementById('load-input-file').click();">
                <input type="file" id="load-input-file" onchange="this.files[0].text().then(t => inputEditor.session.setValue(t));" accept=".xml,.xsl,.xslt,.json,.html,.htm,text/xml,application/xml,application/json,application/xml+xslt,text/html">
            </div>
            <div class="resizer resizer-vertical" id="input-code-resizer" role="separator" aria-orientation="vertical" aria-label="Resize input and code editors"></div>
            <div id="code-col" class="grid-item">
                <div id="code-editor" class="editor"></div>
                <input type="button" id="load-code" value="load" onclick="document.getElementById('load-code-file').click();">
                <input type="file" id="load-code-file" onchange="this.files[0].text().then(t => codeEditor.session.setValue(t));" accept=".xml,.xsl,.xslt,.xsd,text/xml,application/xml,application/xml+xslt">
            </div>
        </section>

        <div class="resizer resizer-horizontal" id="top-bottom-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize input/code row and result rows"></div>

        <div id="bottom-group">
            <section class="grid-row button-bar">
                <label>
                    Result documents:
                    <select name="results" id="results"></select>
                </label>
                <label id="render-result">
                    render result
                    <input type="checkbox" id="render-box" name="render-box" checked>
                </label>
            </section>
            <section class="grid-row" id="result-row">
                <div class="grid-item" id="result-editor-col">
                    <div id="result-editor" class="editor"></div>
                    <a id="save-result" onclick="saveResult(this);">save</a>
                </div>
                <div class="resizer resizer-vertical" id="result-frame-resizer" role="separator" aria-orientation="vertical" aria-label="Resize result editor and result frame"></div>
                <div id="result-frame-container" class="grid-item">
                    <iframe id="current-result-frame" name="current-result-frame" src="about:blank" sandbox="allow-forms allow-scripts allow-same-origin"></iframe>
                </div>
            </section>
        </div>

    </main>
</div>


<script src="js/frame-write.js"></script>
<script src="js/ace-modes.js"></script>
<script src="js/ace-editors-init.js"></script>
<script src="js/resizable-panes.js"></script>
<script src="js/event-listeners-init.js"></script>
<script src="js/init-examples.js"></script>

</body>
</html>
