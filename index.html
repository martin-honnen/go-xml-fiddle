<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Go WebAssembly Example</title>
</head>
<body>
<h1>Go WebAssembly Demo</h1>
<button onclick="testGreet()">Click Me!</button>
<div id="output"></div>
<script>
    const worker = new Worker("worker.js");
    let workerReady = false;
    worker.onmessage = ({ data }) => {
        let { action, payload } = data;
        switch (action) {
            case "ready":
                workerReady = true;
                worker.postMessage({action: "greet", payload: {name: "Developer"}});
                break;
            case "result":
                console.log("we got a result: ", payload);
                document.getElementById("output").innerHTML = payload;
                break;
            default:
                console.error(`Unknown action: ${action}`);
        }
    };

    function testGreet() {
        if (workerReady) {
            worker.postMessage({action: "greet", payload: {name: "Developer"}});
        } else {
            console.error("Worker is not ready yet.");
        }
    }
</script>
