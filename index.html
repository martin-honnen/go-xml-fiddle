<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Go WebAssembly Example</title>
</head>
<body>
<h1>Go WebAssembly Demo</h1>
<button onclick="testGreet()">Test greeting!</button>
<button onclick="testXPath()">Test XPath!</button>
<button onclick="testXSLT30()">Test XSLT 3.0!</button>
<button onclick="testXQuery()">Test XQuery!</button>
<pre id="output"></pre>
<script>
    const worker = new Worker("worker.js");
    let workerReady = false;
    worker.onmessage = ({ data }) => {
        let { action, payload } = data;
        switch (action) {
            case "ready":
                workerReady = true;
                worker.postMessage({action: "greet", payload: {name: "Developer"}});
                break;
            case "result":
                console.log("we got a result: ", payload);
                document.getElementById("output").textContent = payload;
                break;
            // A transformation answers with a list of result documents, each
            // with the label it is known by, so this demo simply prints them
            // one after another under their labels.
            case "XSLT-Results":
                console.log("we got results: ", payload);
                document.getElementById("output").textContent =
                    payload.map(r => r.uri + "\n" + r.content).join("\n\n");
                break;
            default:
                console.error(`Unknown action: ${action}`);
        }
    };

    function testXPath() {
        if (workerReady) {
            worker.postMessage({action: "xpath", payload: {xml : "<root><item>b</item><item>c</item><item>a</item></root>", expression: "sort(//item)"}});
        } else {
            console.error("Worker is not ready yet.");
        }
    }

    function testXSLT30() {
        if (workerReady) {
            worker.postMessage({action: "xslt", payload: {xml : "<root><item>b</item><item>c</item><item>a</item></root>", xslt: "<xsl:stylesheet version='3.0' xmlns:xsl='http://www.w3.org/1999/XSL/Transform' expand-text='yes'><xsl:mode on-no-match='shallow-copy'/><xsl:template match='/'><xsl:copy><xsl:apply-templates/><xsl:comment>Run with {system-property('xsl:product-name')} {system-property('xsl:product-version')} at {current-dateTime()}</xsl:comment></xsl:copy></xsl:template></xsl:stylesheet>"}});
        }
        else {
            console.error("Worker is not ready yet.");
        }
    }

    function testXQuery() {
        if (workerReady) {
            worker.postMessage({action: "xquery",
                payload: {
                    xml: "<root><item>b</item><item>c</item><item>a</item></root>",
                    query: "declare namespace output = 'http://www.w3.org/2010/xslt-xquery-serialization'; declare option output:method 'adaptive'; declare option output:indent 'yes'; * ! element { node-name() } { sort(item) }"
                }
            });
        } else {
            console.error("Worker is not ready yet.");
        }
    }
    function testGreet() {
        if (workerReady) {
            worker.postMessage({action: "greet", payload: {name: "Developer"}});
        } else {
            console.error("Worker is not ready yet.");
        }
    }
</script>

</body>
